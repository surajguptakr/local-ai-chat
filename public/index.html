<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalAI Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .app {
      width: min(900px, 95%);
      margin: 30px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    header {
      padding: 24px;
      background: #111827;
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 7px 12px;
      border-radius: 20px;
      background: #166534;
      font-size: 13px;
    }

    .chat {
      height: 500px;
      overflow-y: auto;
      padding: 22px;
      background: #f9fafb;
    }

    .message {
      max-width: 78%;
      margin-bottom: 16px;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant {
      margin-right: auto;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .system {
      max-width: 100%;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0 18px;
    }

    .typing {
      font-style: italic;
      color: #6b7280;
    }

    .controls {
      padding: 18px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 52px;
      max-height: 140px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton {
      background: #2563eb;
      color: white;
    }

    #sendButton:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #clearButton {
      margin-top: 10px;
      padding: 10px 14px;
      background: #e5e7eb;
      color: #374151;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
        margin: 0;
        border-radius: 0;
      }

      .chat {
        height: calc(100vh - 250px);
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>LocalAI Chat</h1>
      <p>Private AI running directly on your device</p>
      <div class="badge">● QVAC Local Inference</div>
    </header>

    <main id="chat" class="chat">
      <div class="system">
        Your conversation is processed locally using QVAC.
      </div>
    </main>

    <section class="controls">
      <div class="input-row">
        <textarea
          id="messageInput"
          placeholder="Ask your local AI something..."
        ></textarea>

        <button id="sendButton">Send</button>
      </div>

      <button id="clearButton">Clear Conversation</button>

      <div id="status" class="status">
        Ready — QVAC local model is loaded.
      </div>
    </section>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");

    let chatHistory = [];

    function addMessage(role, content) {
      const message = document.createElement("div");
      message.className = `message ${role}`;
      message.textContent = content;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || sendButton.disabled) {
        return;
      }

      input.value = "";

      addMessage("user", message);
      chatHistory.push({
        role: "user",
        content: message
      });

      sendButton.disabled = true;
      input.disabled = true;
      status.textContent = "AI is thinking locally...";

      const typingMessage = addMessage(
        "assistant",
        "Generating response..."
      );
      typingMessage.classList.add("typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            history: chatHistory
          })
        });

        const data = await response.json();

        typingMessage.remove();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        addMessage("assistant", data.response);

        chatHistory.push({
          role: "assistant",
          content: data.response
        });

        status.textContent = "Ready — response generated locally.";
      } catch (error) {
        typingMessage.remove();

        addMessage(
          "assistant",
          `Error: ${error.message}`
        );

        status.textContent = "Error during local inference.";
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    clearButton.addEventListener("click", () => {
      chatHistory = [];

      chat.innerHTML = `
        <div class="system">
          New conversation started. Your messages stay on this device.
        </div>
      `;

      status.textContent = "Ready — conversation cleared.";
      input.focus();
    });
  </script>
</body>
</html>
