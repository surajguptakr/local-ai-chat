<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalAI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #6b7280;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      font-weight: bold;
    }

    .chat-box {
      background: white;
      border-radius: 16px;
      min-height: 520px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .message {
      margin-bottom: 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: #f1f5f9;
      color: #1f2937;
      border-bottom-left-radius: 4px;
    }

    .label {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 5px;
      opacity: 0.7;
    }

    .input-area {
      display: flex;
      gap: 10px;
      border-top: 1px solid #e5e7eb;
      padding-top: 15px;
    }

    #messageInput {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .clear-button {
      margin-top: 12px;
      padding: 9px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .clear-button:hover {
      background: #f3f4f6;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>LocalAI Chat</h1>

    <p>
      Private AI running directly on your device
    </p>

    <span class="badge">
      ● QVAC Local Inference
    </span>
  </header>

  <div class="chat-box">

    <div id="messages">

      <div class="message assistant">
        <div class="bubble">

          <div class="label">
            LOCAL AI
          </div>

          Hello! I'm running locally through QVAC.
          Ask me anything.

        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Ask something..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

    <button
      class="clear-button"
      id="clearButton"
    >
      Clear Conversation
    </button>

  </div>

  <div
    class="status"
    id="status"
  >
    AI model loaded locally
  </div>

</div>

<script>

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendButton");

  const clearButton =
    document.getElementById("clearButton");

  const messages =
    document.getElementById("messages");

  const status =
    document.getElementById("status");


  let chatHistory = [];


  function addMessage(text, type) {

    const message =
      document.createElement("div");

    message.className =
      `message ${type}`;


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    const label =
      document.createElement("div");

    label.className =
      "label";

    label.textContent =
      type === "user"
        ? "YOU"
        : "LOCAL AI";


    const content =
      document.createElement("div");

    content.textContent =
      text;


    bubble.appendChild(label);

    bubble.appendChild(content);

    message.appendChild(bubble);

    messages.appendChild(message);


    messages.scrollTop =
      messages.scrollHeight;
  }


  async function sendMessage() {

    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    addMessage(
      message,
      "user"
    );


    chatHistory.push({
      role: "user",
      content: message
    });


    input.value = "";

    button.disabled = true;

    input.disabled = true;

    status.textContent =
      "Local AI is thinking...";


    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              history: chatHistory
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {
        throw new Error(
          data.error ||
          "Request failed."
        );
      }


      addMessage(
        data.response,
        "assistant"
      );


      chatHistory.push({
        role: "assistant",
        content: data.response
      });


      status.textContent =
        "Response generated locally with QVAC";


    } catch (error) {

      addMessage(
        `Error: ${error.message}`,
        "assistant"
      );


      status.textContent =
        "Something went wrong";

    } finally {

      button.disabled =
        false;

      input.disabled =
        false;

      input.focus();
    }
  }


  button.addEventListener(
    "click",
    sendMessage
  );


  input.addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  clearButton.addEventListener(
    "click",
    () => {

      chatHistory = [];

      messages.innerHTML = "";

      addMessage(
        "Conversation cleared. I'm ready for a new local AI conversation.",
        "assistant"
      );

      status.textContent =
        "New local conversation started";

      input.focus();
    }
  );

</script>

</body>
</html>
